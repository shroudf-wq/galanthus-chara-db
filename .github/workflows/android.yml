name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'data/**', 'icons/**', 'desktop/package.json', '.github/workflows/android.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'APKを添付するリリースのタグ（例：v1.11.0）。空ならビルドだけ'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 署名用の鍵を用意
        if: env.HAS_KEY == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: ビルド
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_FILE" ]; then gradle --no-daemon --stacktrace assembleRelease; else gradle --no-daemon --stacktrace assembleDebug; fi

      - name: APKをまとめる
        run: |
          mkdir -p out
          if [ -n "$KS_FILE" ]; then cp android/app/build/outputs/apk/release/app-release.apk out/Galanthus.apk; else cp android/app/build/outputs/apk/debug/app-debug.apk out/Galanthus-debug.apk; fi
          rm -f "$RUNNER_TEMP/release.jks"
          cd out && sha256sum *.apk | tee SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/

      - name: リリースに添付
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EV: ${{ github.event_name }}
          REL_TAG: ${{ github.event.release.tag_name }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          VER=$(python3 -c "import json;print(json.load(open('desktop/package.json'))['version'])")
          if [ "$EV" = "release" ]; then TAG="$REL_TAG"
          elif [ -n "$IN_TAG" ]; then TAG="$IN_TAG"
          else
            # push のときは、同じ版数のリリースにまだAPKがなければ添付する
            TAG=$(gh release list --limit 30 --json tagName -q '.[].tagName' | while read -r t; do v=$(echo "$t" | sed -E 's/^[vV]\.?//'); if [ "$v" = "$VER" ]; then echo "$t"; break; fi; done)
            if [ -z "$TAG" ]; then echo "版数 $VER のリリースがないので添付しません"; exit 0; fi
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx 'Galanthus.apk'; then echo "添付済み"; exit 0; fi
          fi
          case "$TAG" in ""|*[!A-Za-z0-9._-]*) echo "タグの形が正しくありません: $TAG"; exit 1;; esac
          gh release upload "$TAG" out/Galanthus.apk --clobber
